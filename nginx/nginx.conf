events { worker_connections 1024; }

http {
    server {
        listen 80;

        # Redirigir Webhooks a FastAPI
        location /webhooks/stripe {
            # Elimina la ruta del final, deja solo el host y puerto
            proxy_pass http://backend:8000; 
            
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # Desactiva el buffering para que el cuerpo pase íntegro y rápido
            proxy_buffering off;
            proxy_request_buffering off;
        }

        # Redirigir todo lo demás al Frontend (opcional pero recomendado)
        location / {
            proxy_pass http://frontend:5173;
            proxy_set_header Host $host;
        }
    }
}